<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>大学コード検索</title>

<style>
body{
    font-family:"Yu Gothic","Meiryo",sans-serif;
    max-width:1200px;
    margin:20px auto;
    padding:20px;
}

h1{
    color:#003366;
}

#searchBox{
    width:100%;
    padding:12px;
    font-size:18px;
    box-sizing:border-box;
}

#status{
    margin-top:15px;
    margin-bottom:15px;
    color:#666;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#003366;
    color:white;
    text-align:left;
    padding:10px;
}

td{
    border-bottom:1px solid #ddd;
    padding:8px;
}

tr:hover{
    background:#f5f5f5;
}

.code{
    font-family:Consolas,monospace;
    font-weight:bold;
    white-space:nowrap;
}

.error{
    color:red;
}
</style>

</head>
<body>

<h1>高１・２用　大学コード検索</h1>
<br>
<h3> 千葉県立長生高等学校　進路指導部</h3>
<p>
大学名・学部名・学科名・略称・コード番号を入力してください。複数語をスペースで区切るとAND検索になります。
</p>

<input
    id="searchBox"
    type="text"
    placeholder="例：千葉 教育">

<div id="status">
データ読込中...
</div>

<table>
    <thead>
        <tr>
            <th style="width:180px;">コード</th>
            <th>大学・学部・学科</th>
        </tr>
    </thead>
    <tbody id="results"></tbody>
</table>

<script>

const MAX_DISPLAY = 100;

let data = [];

/* CSV読込 */

async function loadCSV() {

    try {

        const startTime = performance.now();

        const response = await fetch(
            "https://chosei-sinro.github.io/univ-search12/univcode12.csv"
        );

        if (!response.ok) {
            throw new Error("CSV読込失敗");
        }

        let csvText = await response.text();

        csvText = csvText.replace(/^\uFEFF/, "");

        const lines = csvText.trim().split(/\r?\n/);

        console.log("総行数", lines.length);

        data = [];

        for (let i = 1; i < lines.length; i++) {

            const line = lines[i];

            const parts = parseCsvLine(line);

            if (parts.length < 3) continue;

            const code10 = parts[0];
            const univtxt = parts[1];
            const univsearch = parts[2];

            data.push({
                code10,
                univtxt,
                univsearch,
                searchText:
                    (
                        code10 + " " +
                        univtxt + " " +
                        univsearch
                    ).toLowerCase()
            });
        }

        const elapsed =
            ((performance.now() - startTime) / 1000)
            .toFixed(2);

        document.getElementById("status").textContent =
            `${data.length.toLocaleString()}件読込完了 (${elapsed}秒)`;

    }
    catch(error){

        console.error(error);

        document.getElementById("status").innerHTML =
            '<span class="error">CSV読込エラー</span>';
    }
}

/* 高速CSV解析 */

function parseCsvLine(line){

    const result = [];

    let current = "";
    let inQuotes = false;

    for(let i=0;i<line.length;i++){

        const c = line[i];

        if(c === '"'){
            inQuotes = !inQuotes;
            continue;
        }

        if(c === "," && !inQuotes){
            result.push(current);
            current = "";
        }
        else{
            current += c;
        }
    }

    result.push(current);

    return result;
}

/* 検索 */

function search(){

    const query =
        document
            .getElementById("searchBox")
            .value
            .trim()
            .toLowerCase();

    if(query.length < 2){

        document.getElementById("results").innerHTML = "";

        document.getElementById("status").textContent =
            `${data.length.toLocaleString()}件登録されています。`;

        return;
    }

    const keywords = query.split(/\s+/);

    let hitCount = 0;

    let html = "";

    for(const row of data){

        let matched = true;

        for(const keyword of keywords){

            if(!row.searchText.includes(keyword)){
                matched = false;
                break;
            }
        }

        if(!matched) continue;

        hitCount++;

        if(hitCount <= MAX_DISPLAY){

            html += `
            <tr>
                <td class="code">${escapeHtml(row.code10)}</td>
                <td>${escapeHtml(row.univtxt)}</td>
            </tr>`;
        }
    }

    document.getElementById("results").innerHTML = html;

    document.getElementById("status").textContent =
        `${hitCount.toLocaleString()}件ヒット（先頭${MAX_DISPLAY}件を表示）`;
}

/* HTMLエスケープ */

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
}

document
    .getElementById("searchBox")
    .addEventListener("input", search);

loadCSV();

</script>

</body>
</html>
